language: cpp
os: linux
compiler: clang
matrix:
    include:
        addons:
            apt:
                sources: 
                    - ubuntu-toolchain-r-test
                    - llvm-toolchain-precise-3.6
                packages: 
                    - clang-3.6
                    - libboost-dev
                    - libboost-date-time-dev
                    - libyaml-cpp-dev
            env: COMPILER=clang++-3.6
before_install:
    - echo $CXX
script:
    - cd third_party/armadillo-5.400.2; cmake -DCMAKE_INSTALL_PREFIX=$HOME && make && make install; cd -
    - ./autogen.sh
    - ./configure CXX=$COMPILER
    - make && make check
