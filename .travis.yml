language: cpp
sudo: false
matrix:
    include:
        -   
            os: linux
            compiler: clang
            addons:
                apt:
                    sources:
                        - llvm-toolchain-precise-3.6
                        - ubuntu-toolchain-r-test
                        - boost-latest
                    packages: 
                        - clang-3.6
                        - libboost1.55-all-dev
                        - libboost1.55-all-dev
            env:
                - INSTALL_CXX=clang++-3.6
#   include:
#       -   
#           os: linux
#           compiler: gcc
#           addons:
