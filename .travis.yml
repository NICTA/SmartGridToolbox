language: 
    - cpp
    - objective-c

compiler: 
    - clang

os:
    - linux
    - osx

matrix:
    exclude:
        os: linux

branches: 
    - master

before_install:
    - echo $TRAVIS_OS_NAME
    - brew update
    - brew install boost --c++11 
    - brew install yaml-cpp --c++11 
    - brew install suite-sparse
